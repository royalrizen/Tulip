[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tulip"
version = "0.1.0"
description = "A Discord bot made for the Velouré Discord server"
requires-python = ">=3.11"

dependencies = [
    "discord.py",
    "python-dotenv",
    "aiomysql",
    "cryptography",
    "Flask",
    "psutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bot.web" = ["templates/*.html"]

[[tool.setuptools.ext-modules]]
name = "bot.llm.tuliplm_native"
sources = ["src/bot/llm/tuliplm.c"]

[project.scripts]
tulip = "bot.__main__:main"
